# A Go Terraform provider keeps the layout every provider has: the Registry,
# goreleaser and the Go toolchain read these from the root, and keeping
# upstream's layout keeps the fork mergeable with terraprovider.
layout:
  exceptions:
    - path: go.mod
      reason: Go module, read from the root by the toolchain.
    - path: go.sum
      reason: Go module checksums, next to go.mod.
    - path: main.go
      reason: The provider binary's entry point (package main at the module root, as every Terraform provider).
    - path: terraform-registry-manifest.json
      reason: Read from the root by the Terraform Registry (plugin protocol version).
    - path: .goreleaser.yml
      reason: Read from the root by goreleaser, which builds and signs the release.
    - path: .golangci.yml
      reason: Read from the root by golangci-lint.
    - path: aqua
      reason: Upstream's pinned tool versions (aqua), kept to stay mergeable with upstream.
    - path: cmd
      reason: The generator (cmd/gen-tf), Go's convention for commands.
    - path: internal
      reason: The provider code, Go's convention for packages not importable from outside.
    - path: examples
      reason: Terraform examples that tfplugindocs renders into docs/ (Registry documentation).

# Copy of bearclave/ci .github/workflows/security.yml at v2.9.1, unchanged below
# this header: a public repository cannot call a reusable workflow of the
# private bearclave/ci. Update it from a newer release of ci by hand.
# Security checks every repository in the organisation runs on its pull
# requests: no secret anywhere in the history, workflows that are sound and
# shell scripts without real defects.
#
# A caller needs one job, and the check it reports is "security / scan":
#
#   jobs:
#     security:
#       uses: bearclave/ci/.github/workflows/security.yml@v2
#       permissions:
#         contents: read
#
# The tools arrive as release binaries checked against the sha256 below: the
# organisation allows only GitHub-owned, verified, azure/* and hashicorp/*
# actions. Dependabot does not see these pins, so a version and its checksum
# are bumped here together, by hand. The checksum is the `digest` GitHub
# publishes with the release asset.
name: security

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: "1.30.1"
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
    steps:
      # gitleaks reads the history, not just the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Outside the checkout, so that none of the scanners reads the tools.
      - name: Install tools
        run: |
          bin="$RUNNER_TEMP/tools"
          mkdir -p "$bin"
          fetch() { # url sha256 file
            curl -fsSL --retry 3 "$1" -o "$3"
            echo "$2  $3" | sha256sum -c - >/dev/null
          }
          t=$(mktemp -d)
          gh_dl=https://github.com
          fetch "$gh_dl/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" "$t/gitleaks.tgz"
          tar -xzf "$t/gitleaks.tgz" -C "$bin" gitleaks
          fetch "$gh_dl/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$ACTIONLINT_SHA256" "$t/actionlint.tgz"
          tar -xzf "$t/actionlint.tgz" -C "$bin" actionlint
          fetch "$gh_dl/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            "$ZIZMOR_SHA256" "$t/zizmor.tgz"
          tar -xzf "$t/zizmor.tgz" -C "$bin" zizmor
          fetch "$gh_dl/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.gz" \
            "$SHELLCHECK_SHA256" "$t/shellcheck.tgz"
          tar -xzf "$t/shellcheck.tgz" -C "$t"
          mv "$t/shellcheck-v$SHELLCHECK_VERSION/shellcheck" "$bin/"
          echo "$bin" >>"$GITHUB_PATH"
          for tool in gitleaks actionlint zizmor shellcheck; do
            echo "$tool: $("$bin/$tool" --version 2>&1 | head -1)"
          done

      # Stands in for secret scanning, which a private repository gets only
      # with the paid Secret Protection add-on. A false positive is allowed in
      # the repository's .gitleaks.toml, with the reason and a review date in its
      # description.
      - name: gitleaks
        run: gitleaks git --no-banner --redact --exit-code 1 .

      # Every allowlist of .gitleaks.toml ends its description with
      # "review: YYYY-MM-DD"; a date that has passed is a warning.
      - name: gitleaks exception reviews
        if: ${{ !cancelled() && hashFiles('.gitleaks.toml') != '' }}
        run: |
          script="$RUNNER_TEMP/exception_review.py"
          cat >"$script" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Checks the exceptions of a repository: each says why, and when to look again.

          Usage: exception_review.py [--today YYYY-MM-DD] <kind>=<file> [<kind>=<file> ...]

          Kinds and the file each reads (the YAML ones converted to JSON by yq first,
          so that this needs nothing beyond the standard library):

            conventions  .github/conventions.yaml   exceptions[]: rule, path, reason, review
                                                    layout.exceptions[]: path, reason, review (optional)
            sentinel     .github/sentinel-lint.yaml exceptions[]: rule, path, reason, review
            trivy        .github/trivyignore.yaml   <section>[]: id, paths, statement, review
            gitleaks     .gitleaks.toml             [[allowlists]]: description ending in
                                                    "review: YYYY-MM-DD"

          `review` is the date (YYYY-MM-DD) by which the exception is looked at again:
          still needed, still for the same reason. A date that has passed is a warning,
          not a failure - the finding stays accepted until someone decides. A missing
          reason or a date that is not a date fails; a missing date is a warning.

          `<file>` is what the annotation names; `<kind>=<file>:<json>` reads the
          converted JSON from <json> and names <file>.
          """
          import datetime
          import json
          import os
          import re
          import sys
          import tomllib

          RE_DATE = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          RE_GITLEAKS_REVIEW = re.compile(r"^\s*review:\s*(\S+)\s*$", re.I | re.M)
          TRIVY_SECTIONS = ("misconfigurations", "vulnerabilities", "secrets", "licenses")


          def entries(kind: str, data) -> list:
              """(label, reason, review, required) for every exception in the file."""
              out = []
              if kind == "conventions":
                  for e in (data or {}).get("exceptions") or []:
                      out.append((f"{e.get('rule')} {e.get('path', '')}".strip(), e.get("reason"), e.get("review"), True))
                  for e in ((data or {}).get("layout") or {}).get("exceptions") or []:
                      # The layout exceptions are structure (a folder that has to be
                      # where it is); a review date is welcome but not asked for.
                      out.append((f"layout {e.get('path')}", e.get("reason"), e.get("review"), False))
              elif kind == "sentinel":
                  for e in (data or {}).get("exceptions") or []:
                      rule = e.get("rule") if "check" not in e else e.get("check")
                      path = e.get("path") if "check" not in e else e.get("rule")
                      out.append((f"{rule} {path or ''}".strip(), e.get("reason"), e.get("review"), True))
              elif kind == "trivy":
                  for section in TRIVY_SECTIONS:
                      for e in (data or {}).get(section) or []:
                          paths = e.get("paths") or []
                          where = f" ({len(paths)} paths)" if len(paths) > 1 else (f" {paths[0]}" if paths else "")
                          out.append((f"{e.get('id')}{where}", e.get("statement"), e.get("review"), True))
              elif kind == "gitleaks":
                  lists = list(data.get("allowlists") or [])
                  if data.get("allowlist"):
                      lists.insert(0, data["allowlist"])
                  for k, e in enumerate(lists):
                      description = str(e.get("description") or "")
                      m = RE_GITLEAKS_REVIEW.search(description)
                      reason = RE_GITLEAKS_REVIEW.sub("", description).strip()
                      out.append((f"allowlist {k + 1}", reason, m.group(1) if m else None, True))
              else:
                  raise ValueError(f"unknown kind {kind!r}")
              return out


          def review(kind: str, data, today: datetime.date) -> tuple:
              """(errors, warnings, rows) for one file; rows feed the job summary."""
              errors, warnings, rows = [], [], []
              for label, reason, date, required in entries(kind, data):
                  if not str(reason or "").strip():
                      errors.append(f"exception {label} has no reason")
                  if date in (None, ""):
                      if required:
                          warnings.append(f"exception {label} has no review date (review: YYYY-MM-DD)")
                      continue
                  date = str(date)
                  if not RE_DATE.match(date):
                      errors.append(f"exception {label}: review {date!r} is not a date (YYYY-MM-DD)")
                      continue
                  try:
                      due = datetime.date.fromisoformat(date)
                  except ValueError:
                      errors.append(f"exception {label}: review {date!r} is not a date (YYYY-MM-DD)")
                      continue
                  if due < today:
                      warnings.append(f"exception {label} was due for review on {date}: is it still needed?")
                  rows.append((label, date, due < today))
              return errors, warnings, rows


          def load(kind: str, path: str):
              if kind == "gitleaks":
                  with open(path, "rb") as fh:
                      return tomllib.load(fh)
              with open(path, encoding="utf-8") as fh:
                  return json.load(fh)


          def escape(text: str) -> str:
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def main(args: list) -> int:
              today = datetime.date.today()
              if args[:1] == ["--today"]:
                  today, args = datetime.date.fromisoformat(args[1]), args[2:]
              if not args:
                  print(__doc__)
                  return 2
              failed, summary = False, []
              for arg in args:
                  kind, _, rest = arg.partition("=")
                  name, _, source = rest.partition(":")
                  try:
                      data = load(kind, source or name)
                      errors, warnings, rows = review(kind, data, today)
                  except (OSError, ValueError, tomllib.TOMLDecodeError) as e:
                      errors, warnings, rows = [f"cannot read: {e}"], [], []
                  for e in errors:
                      print(f"::error file={name},title=exception::{escape(e)}")
                  for w in warnings:
                      print(f"::warning file={name},title=exception review::{escape(w)}")
                  failed |= bool(errors)
                  summary += [f"| `{name}` | {label.replace('|', '/')} | {date}{' - **due**' if due else ''} |"
                              for label, date, due in rows]
              if summary:
                  text = "## Exceptions\n\n| File | Exception | Review |\n|---|---|---|\n" + "\n".join(summary) + "\n"
                  if os.environ.get("GITHUB_STEP_SUMMARY"):
                      with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                          fh.write(text)
                  else:
                      print(text)
              return 1 if failed else 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          __CI_EOF__
          python3 "$script" gitleaks=.gitleaks.toml

      # Also runs shellcheck over the scripts inside `run:`.
      - name: actionlint
        run: actionlint -color

      # The organisation's own reusable workflows are referenced by a moving
      # tag on purpose (see the README of bearclave/ci); everything else has
      # to be pinned to a commit, which the organisation enforces as well.
      #
      # ref-confusion is off: it reads the branches and tags of every action
      # referenced by a tag or branch, and the caller's token cannot read the
      # private bearclave/ci, so the audit ends in a fatal error. Nothing else
      # is referenced by a tag or branch - pinning to a commit is enforced -
      # so the audit has nothing left to check.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          config="$RUNNER_TEMP/zizmor.yml"
          cat >"$config" <<'EOF'
          rules:
            ref-confusion:
              disable: true
            unpinned-uses:
              config:
                policies:
                  "bearclave/*": ref-pin
                  "*": hash-pin
          EOF
          zizmor --persona=regular --min-severity=medium --config "$config" .github/workflows

      # Warnings and errors only: the style notes would fail on intentional
      # word splitting.
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts"
            exit 0
          fi
          shellcheck --severity=warning "${scripts[@]}"

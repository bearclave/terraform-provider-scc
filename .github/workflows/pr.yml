# The pull request check, reported as "pr / check". The full check of the
# organisation (bearclave/ci pr.yml) cannot be called from a public
# repository; this one checks what reaches main: the title, the branch name
# and the sections of the description, with the patterns of that check.
name: pr

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: pr / check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: title, branch, description
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: python
        run: |
          import os, re, sys
          types = "feat|fix|perf|refactor|docs|test|ci|chore|deps|revert"
          title, branch = os.environ["TITLE"], os.environ["BRANCH"]
          body, author = os.environ.get("BODY") or "", os.environ["AUTHOR"]
          errors = []
          if not re.fullmatch(rf"({types})(\([a-z0-9][a-z0-9._/-]*\))?!?: \S.*", title):
              errors.append(f"title is not a Conventional Commit: {title}")
          elif len(title) > 72 and not author.endswith("[bot]"):
              errors.append(f"title longer than 72 characters ({len(title)})")
          if not re.fullmatch(rf"({types})/[a-z0-9][a-z0-9-]*|dependabot/.+", branch):
              errors.append(f"branch is not <type>/<slug>: {branch}")
          if author != "dependabot[bot]":
              for section in ("Why", "What changes", "Impact", "Verification", "Review", "Links"):
                  if not re.search(rf"^## {re.escape(section)}\s*$", body, re.M):
                      errors.append(f"description has no section '## {section}'")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)

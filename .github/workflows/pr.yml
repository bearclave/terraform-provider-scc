# Managed by bearclave/governance (tools/sync.py) - do not edit here.
# The pull request check of the organisation standards: title, branch,
# description, labels, assignee, root layout. Reports as "pr / check",
# required on the default branch (main; staging in an application).
name: pr

on:
  pull_request:
    branches: [main, staging]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: bearclave/ci/.github/workflows/pr.yml@v2
    permissions:
      contents: read
      pull-requests: write
